name: Extract uploaded archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract archive and clean up
        run: |
          set -e
          unzip -o github-cybersecurity-labs.zip
          shopt -s dotglob
          mv github-cybersecurity-labs/* .
          rmdir github-cybersecurity-labs
          rm -f github-cybersecurity-labs.zip
          rm -f .github/workflows/extract.yml
          echo "Extracted files:"
          find . -type f -not -path './.git/*' | sort
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force --all
          git status --short
          git commit -m "Extract cybersecurity-labs archive"
          git push
